<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ trợ - NiNi Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .support-container {
            max-width: 600px;
            margin: 60px auto;
            text-align: center;
            padding: 20px;
        }
        .support-container .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .support-container h1 {
            color: #ffd700;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .support-info {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 30px;
            color: #ccc;
            line-height: 2.5;
        }
        .support-info .highlight {
            color: #ffd700;
            font-weight: bold;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #888;
            text-decoration: none;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,215,0,0.05);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="support-container">
        <div class="icon">⚙️</div>
        <h1>Trung tâm hỗ trợ</h1>
        <div class="support-info">
            <p>📱 <span class="highlight">Zalo:</span> 0909.xxx.xxx</p>
            <p>💬 <span class="highlight">Discord:</span> NiNiStore#1234</p>
            <p>📧 <span class="highlight">Email:</span> support@ninistore.com</p>
            <p>⏰ <span class="highlight">Thời gian:</span> 24/7</p>
            <p style="color:#555; margin-top:10px;">Luôn sẵn sàng giúp đỡ bạn!</p>
        </div>
        <a href="home.html" class="back-btn">⬅ Quay lại trang chủ</a>
    </div>
</body>
</html>
