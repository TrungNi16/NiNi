<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem Uphone - NiNi Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .redeem-container {
            max-width: 500px;
            margin: 60px auto;
            text-align: center;
            padding: 20px;
        }
        .redeem-container .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .redeem-container h1 {
            color: #ffd700;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .redeem-form {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 30px;
        }
        .redeem-form input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
        }
        .redeem-form input:focus {
            border-color: #ffd700;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #0a0a1a;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            transform: scale(1.02);
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #888;
            text-decoration: none;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,215,0,0.05);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="redeem-container">
        <div class="icon">🔄</div>
        <h1>Redeem Uphone 4H</h1>
        <div class="redeem-form">
            <input type="text" placeholder="Nhập mã code Uphone 4H">
            <button class="btn-submit" onclick="alert('✅ Redeem thành công! Bạn đã nhận được Uphone 4H.')">Xác nhận</button>
        </div>
        <a href="home.html" class="back-btn">⬅ Quay lại trang chủ</a>
    </div>
</body>
</html>
