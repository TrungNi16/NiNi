<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - NiNi Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {
            background: rgba(255,255,255,0.05);
            padding: 40px 35px;
            border-radius: 20px;
            border: 1px solid rgba(255,215,0,0.2);
            width: 420px;
            max-width: 90%;
            box-shadow: 0 0 50px rgba(255,215,0,0.05);
        }

        .register-box h1 {
            color: #ffd700;
            text-align: center;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .register-box .sub {
            color: #888;
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .register-box label {
            display: block;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .register-box input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 18px;
            transition: 0.3s;
        }

        .register-box input:focus {
            border-color: #ffd700;
            outline: none;
            box-shadow: 0 0 20px rgba(255,215,0,0.05);
        }

        .register-box input::placeholder { color: #555; }

        .btn-group { display: flex; gap: 12px; margin-top: 10px; }

        .btn-group button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-cancel {
            background: rgba(255,255,255,0.05);
            color: #888;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-cancel:hover { background: rgba(255,255,255,0.1); }

        .btn-register {
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #0a0a1a;
        }

        .btn-register:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255,215,0,0.15);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-link a { color: #ffd700; text-decoration: none; font-weight: 600; }
        .login-link a:hover { color: #ffed4a; }

        .error-msg {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.2);
            border-radius: 10px;
            padding: 10px;
            color: #ff6666;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .success-msg {
            background: rgba(0,255,0,0.05);
            border: 1px solid rgba(0,255,0,0.15);
            border-radius: 10px;
            padding: 10px;
            color: #66ff66;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="register-box">
    <h1>🌟 NINI STORE</h1>
    <p class="sub">Tạo tài khoản mới</p>

    <div id="errorMsg" class="error-msg">❌ Lỗi đăng ký!</div>
    <div id="successMsg" class="success-msg">✅ Đăng ký thành công!</div>

    <form id="registerForm">
        <label>👤 Tài khoản</label>
        <input type="text" id="username" placeholder="Tối thiểu 3 ký tự" required>

        <label>🔒 Mật khẩu</label>
        <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" required>

        <label>✅ Nhập lại mật khẩu</label>
        <input type="password" id="confirm" placeholder="Nhập lại mật khẩu" required>

        <label id="captchaLabel">🧮 Giải phép tính: ...</label>
        <input type="number" id="captcha" placeholder="Nhập kết quả" required>

        <div class="btn-group">
            <button type="reset" class="btn-cancel" onclick="newCaptcha()">HỦY</button>
            <button type="submit" class="btn-register">XÁC NHẬN</button>
        </div>
    </form>

    <p class="login-link">
        Đã có tài khoản? <a href="index.html">Đăng nhập</a>
    </p>
</div>

<script>
    var currentCaptchaAnswer = 0;

    function newCaptcha() {
        var a = Math.floor(Math.random() * 50) + 1;
        var b = Math.floor(Math.random() * 50) + 1;
        var op = Math.random() < 0.5 ? '+' : '-';

        if (op === '-' && a < b) {
            var temp = a; a = b; b = temp;
        }

        if (op === '+') {
            currentCaptchaAnswer = a + b;
            document.getElementById('captchaLabel').textContent = '🧮 Giải phép tính: ' + a + ' + ' + b + ' = ?';
        } else {
            currentCaptchaAnswer = a - b;
            document.getElementById('captchaLabel').textContent = '🧮 Giải phép tính: ' + a + ' - ' + b + ' = ?';
        }
        document.getElementById('captcha').value = '';
    }

    window.addEventListener('DOMContentLoaded', newCaptcha);

    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        var user = document.getElementById('username').value.trim();
        var pass = document.getElementById('password').value.trim();
        var confirm = document.getElementById('confirm').value.trim();
        var captcha = document.getElementById('captcha').value.trim();

        var errorMsg = document.getElementById('errorMsg');
        var successMsg = document.getElementById('successMsg');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if (parseInt(captcha) !== currentCaptchaAnswer) {
            errorMsg.textContent = '❌ Sai mã xác nhận!';
            errorMsg.style.display = 'block';
            newCaptcha();
            return;
        }

        if (user.length < 3) {
            errorMsg.textContent = '❌ Tài khoản phải có ít nhất 3 ký tự!';
            errorMsg.style.display = 'block';
            newCaptcha();
            return;
        }

        if (pass.length < 6) {
            errorMsg.textContent = '❌ Mật khẩu phải có ít nhất 6 ký tự!';
            errorMsg.style.display = 'block';
            newCaptcha();
            return;
        }

        if (pass !== confirm) {
            errorMsg.textContent = '❌ Mật khẩu nhập lại không khớp!';
            errorMsg.style.display = 'block';
            newCaptcha();
            return;
        }

        var users = JSON.parse(localStorage.getItem('users') || '[]');

        var exists = users.some(function(u) { return u.username === user; });

        if (exists) {
            errorMsg.textContent = '❌ Tài khoản đã tồn tại!';
            errorMsg.style.display = 'block';
            newCaptcha();
            return;
        }

        // Lưu user mới
        users.push({
            username: user,
            password: pass,
            createdAt: Date.now()
        });
        localStorage.setItem('users', JSON.stringify(users));

        // ✅ TỰ ĐỘNG LƯU THÔNG TIN ĐĂNG NHẬP
        localStorage.setItem('savedUsername', user);
        localStorage.setItem('savedPassword', pass);
        localStorage.setItem('rememberMe', 'true');

        successMsg.textContent = '✅ Đăng ký thành công! Đang chuyển đến đăng nhập...';
        successMsg.style.display = 'block';

        setTimeout(function() {
            window.location.href = 'index.html';
        }, 1500);
    });
</script>

</body>
</html>
