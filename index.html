<!-- Thay đổi đoạn form và nút bấm -->

<form onsubmit="handleLogin(event)">
    <div class="form-group">
        <label>👤 Tài khoản</label>
        <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>
    </div>

    <div class="form-group">
        <label>🔒 Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" required>
    </div>

    <div class="form-group captcha-group">
        <label>🧮 Giải phép tính: 3 + 1 = ?</label>
        <input type="number" id="captcha" placeholder="Nhập kết quả" required>
    </div>

    <div class="buttons">
        <button type="reset" class="btn-cancel">HỦY</button>
        <button type="submit" class="btn-submit">VÀO WEB</button>
    </div>
</form>

<script>
function handleLogin(event) {
    event.preventDefault(); // Ngăn form gửi đi
    
    var username = document.getElementById('username').value;
    var password = document.getElementById('password').value;
    var captcha = document.getElementById('captcha').value;
    
    // Kiểm tra captcha (3+1=4)
    if (parseInt(captcha) !== 4) {
        alert('❌ Sai mã xác nhận! Vui lòng nhập lại.');
        return;
    }
    
    // Kiểm tra tài khoản (demo)
    if (username === '' || password === '') {
        alert('❌ Vui lòng nhập đầy đủ thông tin!');
        return;
    }
    
    // Đăng nhập thành công -> chuyển đến trang chủ
    alert('✅ Đăng nhập thành công! Chào mừng ' + username + '!');
    window.location.href = 'home.html'; // Chuyển đến trang chủ (nếu có)
}
</script>
