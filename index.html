<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        var user = document.getElementById('username').value.trim();
        var pass = document.getElementById('password').value.trim();
        var captcha = document.getElementById('captcha').value.trim();

        var errorMsg = document.getElementById('errorMsg');
        var successMsg = document.getElementById('successMsg');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        // Kiểm tra captcha: 3 + 1 = 4
        if (parseInt(captcha) !== 4) {
            errorMsg.textContent = '❌ Sai mã xác nhận! 3 + 1 = 4';
            errorMsg.style.display = 'block';
            return;
        }

        if (user === '' || pass === '') {
            errorMsg.textContent = '❌ Vui lòng nhập đầy đủ thông tin!';
            errorMsg.style.display = 'block';
            return;
        }

        // Lấy danh sách user đã lưu
        var users = JSON.parse(localStorage.getItem('users') || '[]');

        // Tìm user
        var foundUser = users.find(function(u) {
            return u.username === user && u.password === pass;
        });

        if (foundUser) {
            successMsg.textContent = '✅ Đăng nhập thành công! Chào mừng ' + user + '!';
            successMsg.style.display = 'block';

            setTimeout(function() {
                window.location.href = 'home.html?user=' + encodeURIComponent(user);
            }, 1500);
        } else {
            // Kiểm tra user có tồn tại không
            var userExists = users.some(function(u) {
                return u.username === user;
            });

            if (userExists) {
                errorMsg.textContent = '❌ Sai mật khẩu! Vui lòng thử lại.';
            } else {
                errorMsg.textContent = '❌ Tài khoản không tồn tại! Vui lòng đăng ký.';
            }
            errorMsg.style.display = 'block';
        }
    });
</script>
