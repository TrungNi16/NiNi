<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - NiNi Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: rgba(255,255,255,0.05);
            padding: 40px 35px;
            border-radius: 20px;
            border: 1px solid rgba(255,215,0,0.2);
            width: 400px;
            max-width: 90%;
            box-shadow: 0 0 50px rgba(255,215,0,0.05);
        }

        .login-box h1 {
            color: #ffd700;
            text-align: center;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .login-box .sub {
            color: #888;
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .login-box label {
            display: block;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .login-box input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 18px;
            transition: 0.3s;
        }

        .login-box input:focus {
            border-color: #ffd700;
            outline: none;
            box-shadow: 0 0 20px rgba(255,215,0,0.05);
        }

        .login-box input::placeholder { color: #555; }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .remember-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #ffd700;
            cursor: pointer;
        }

        .remember-row span { color: #aaa; font-size: 14px; user-select: none; }

        .btn-group { display: flex; gap: 12px; margin-top: 10px; }

        .btn-group button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-group button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-cancel {
            background: rgba(255,255,255,0.05);
            color: #888;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-cancel:hover { background: rgba(255,255,255,0.1); }

        .btn-login {
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #0a0a1a;
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255,215,0,0.15);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .register-link a { color: #ffd700; text-decoration: none; font-weight: 600; }
        .register-link a:hover { color: #ffed4a; }

        .error-msg {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.2);
            border-radius: 10px;
            padding: 10px;
            color: #ff6666;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            font-size: 13px;
        }

        .success-msg {
            background: rgba(0,255,0,0.05);
            border: 1px solid rgba(0,255,0,0.15);
            border-radius: 10px;
            padding: 10px;
            color: #66ff66;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            font-size: 13px;
        }

        .saved-info {
            background: rgba(255,215,0,0.05);
            border: 1px solid rgba(255,215,0,0.1);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 15px;
            color: #ffd700;
            font-size: 13px;
            display: none;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            color: #ffd700;
            font-size: 13px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>🌟 NINI STORE</h1>
    <p class="sub">Free Fire Code Shop</p>

    <div id="savedInfo" class="saved-info">🔐 Đã lưu thông tin đăng nhập</div>
    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>
    <div id="loading" class="loading">⏳ Đang xử lý...</div>

    <form id="loginForm">
        <label>👤 Tài khoản</label>
        <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>

        <label>🔒 Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" required>

        <label id="captchaLabel">🧮 Giải phép tính: ...</label>
        <input type="number" id="captcha" placeholder="Nhập kết quả" required>

        <div class="remember-row" onclick="toggleRemember(event)">
            <input type="checkbox" id="rememberMe">
            <span>💾 Ghi nhớ đăng nhập</span>
        </div>

        <div class="btn-group">
            <button type="reset" class="btn-cancel" onclick="clearSaved()">HỦY</button>
            <button type="submit" class="btn-login" id="loginBtn">VÀO WEB</button>
        </div>
    </form>

    <p class="register-link">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
    </p>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="firebase.js"></script>

<script>
    var currentCaptchaAnswer = 0;

    function newCaptcha() {
        var a = Math.floor(Math.random() * 50) + 1;
        var b = Math.floor(Math.random() * 50) + 1;
        var op = Math.random() < 0.5 ? '+' : '-';

        if (op === '-' && a < b) {
            var temp = a; a = b; b = temp;
        }

        if (op === '+') {
            currentCaptchaAnswer = a + b;
            document.getElementById('captchaLabel').textContent = '🧮 Giải phép tính: ' + a + ' + ' + b + ' = ?';
        } else {
            currentCaptchaAnswer = a - b;
            document.getElementById('captchaLabel').textContent = '🧮 Giải phép tính: ' + a + ' - ' + b + ' = ?';
        }
        document.getElementById('captcha').value = '';
    }

    window.addEventListener('DOMContentLoaded', function() {
        newCaptcha();

        var currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            window.location.href = 'home.html';
            return;
        }

        var savedUser = localStorage.getItem('savedUsername');
        var savedPass = localStorage.getItem('savedPassword');
        var remember = localStorage.getItem('rememberMe');

        if (remember === 'true' && savedUser && savedPass) {
            document.getElementById('username').value = savedUser;
            document.getElementById('password').value = savedPass;
            document.getElementById('rememberMe').checked = true;
            document.getElementById('savedInfo').style.display = 'block';
        }
    });

    function toggleRemember(e) {
        if (e.target.type === 'checkbox') return;
        var checkbox = document.getElementById('rememberMe');
        checkbox.checked = !checkbox.checked;
    }

    function clearSaved() {
        localStorage.removeItem('savedUsername');
        localStorage.removeItem('savedPassword');
        localStorage.removeItem('rememberMe');
        document.getElementById('savedInfo').style.display = 'none';
        newCaptcha();
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        var user = document.getElementById('username').value.trim();
        var pass = document.getElementById('password').value.trim();
        var captcha = document.getElementById('captcha').value.trim();
        var remember = document.getElementById('rememberMe').checked;

        var errorMsg = document.getElementById('errorMsg');
        var successMsg = document.getElementById('successMsg');
        var loading = document.getElementById('loading');
        var loginBtn = document.getElementById('loginBtn');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if (parseInt(captcha) !== currentCaptchaAnswer) {
            errorMsg.textContent = '❌ Sai mã xác nhận!';
            errorMsg.style.display = 'block';
            newCaptcha();
            return;
        }

        if (user === '' || pass === '') {
            errorMsg.textContent = '❌ Vui lòng nhập đầy đủ thông tin!';
            errorMsg.style.display = 'block';
            return;
        }

        loading.style.display = 'block';
        loginBtn.disabled = true;
        loginBtn.textContent = '⏳ Đang kiểm tra...';

        try {
            var cloudUser = await getUserFromCloud(user);

            if (cloudUser && cloudUser.password === pass) {
                await updateLastLogin(user);

                var token = generateToken();
                await saveSessionToCloud(user, token);
                await saveLoginHistory(user, true);

                if (remember) {
                    localStorage.setItem('savedUsername', user);
                    localStorage.setItem('savedPassword', pass);
                    localStorage.setItem('rememberMe', 'true');
                } else {
                    localStorage.removeItem('savedUsername');
                    localStorage.removeItem('savedPassword');
                    localStorage.setItem('rememberMe', 'false');
                }

                localStorage.setItem('currentUser', user);
                localStorage.setItem('sessionToken', token);
                localStorage.setItem('loginTime', Date.now());

                successMsg.textContent = '✅ Đăng nhập thành công! Chào mừng ' + user + '!';
                successMsg.style.display = 'block';

                setTimeout(function() {
                    window.location.href = 'home.html';
                }, 1200);

            } else {
                await saveLoginHistory(user, false);
                errorMsg.textContent = '❌ Sai tài khoản hoặc mật khẩu!';
                errorMsg.style.display = 'block';
                loading.style.display = 'none';
                loginBtn.disabled = false;
                loginBtn.textContent = 'VÀO WEB';
                newCaptcha();
            }

        } catch (error) {
            console.error('Lỗi Firebase:', error);
            errorMsg.textContent = '❌ Lỗi kết nối! Vui lòng thử lại.';
            errorMsg.style.display = 'block';
            loading.style.display = 'none';
            loginBtn.disabled = false;
            loginBtn.textContent = 'VÀO WEB';
        }
    });
</script>

</body>
</html>
