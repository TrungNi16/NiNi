<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nạp thẻ cào - NiNi Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .card-container {
            max-width: 500px;
            margin: 60px auto;
            text-align: center;
            padding: 20px;
        }
        .card-container .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .card-container h1 {
            color: #ffd700;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .card-form {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 30px;
        }
        .card-form input, .card-form select {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
        }
        .card-form input:focus, .card-form select:focus {
            border-color: #ffd700;
            outline: none;
        }
        .card-form select option {
            background: #1a1a2e;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #0a0a1a;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            transform: scale(1.02);
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #888;
            text-decoration: none;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,215,0,0.05);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="icon">💳</div>
        <h1>Nạp thẻ cào</h1>
        <div class="card-form">
            <select>
                <option value="">Chọn nhà mạng</option>
                <option value="viettel">Viettel</option>
                <option value="vinaphone">Vinaphone</option>
                <option value="mobifone">Mobifone</option>
            </select>
            <select>
                <option value="">Chọn mệnh giá</option>
                <option value="10000">10,000đ</option>
                <option value="20000">20,000đ</option>
                <option value="50000">50,000đ</option>
                <option value="100000">100,000đ</option>
                <option value="200000">200,000đ</option>
                <option value="500000">500,000đ</option>
            </select>
            <input type="text" placeholder="Mã thẻ">
            <input type="text" placeholder="Số serial">
            <button class="btn-submit" onclick="alert('✅ Nạp thẻ thành công! Số tiền sẽ được cộng vào tài khoản.')">Xác nhận</button>
        </div>
        <a href="home.html" class="back-btn">⬅ Quay lại trang chủ</a>
    </div>
</body>
</html>
