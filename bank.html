<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nạp Bank/Momo - NiNi Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .bank-container {
            max-width: 500px;
            margin: 60px auto;
            text-align: center;
            padding: 20px;
        }
        .bank-container .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .bank-container h1 {
            color: #ffd700;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .bank-info {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 30px;
            color: #ccc;
            line-height: 2;
        }
        .bank-info .highlight {
            color: #ffd700;
            font-weight: bold;
        }
        .bank-info .note {
            color: #555;
            font-size: 14px;
            margin-top: 15px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #888;
            text-decoration: none;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,215,0,0.05);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="bank-container">
        <div class="icon">🏦</div>
        <h1>Nạp qua Bank / MoMo</h1>
        <div class="bank-info">
            <p>🏦 <span class="highlight">Vietcombank</span></p>
            <p>STK: <span class="highlight">1234 5678 9012</span></p>
            <p>Chủ TK: <span class="highlight">NINI STORE</span></p>
            <hr style="border-color:rgba(255,255,255,0.05); margin:15px 0;">
            <p>📱 <span class="highlight">MoMo / ZaloPay</span></p>
            <p>SĐT: <span class="highlight">0909.xxx.xxx</span></p>
            <div class="note">⚠️ Nội dung chuyển khoản: <strong style="color:#ffd700;">[Tên đăng nhập]</strong></div>
            <div class="note">⏳ Sau khi chuyển, liên hệ admin để cập nhật!</div>
        </div>
        <a href="home.html" class="back-btn">⬅ Quay lại trang chủ</a>
    </div>
</body>
</html>
